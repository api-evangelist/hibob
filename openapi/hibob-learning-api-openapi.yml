openapi: 3.1.0
info:
  title: Bob (HiBob) Public Attendance Learning API
  description: 'Bob''s Public API for managing employees, attendance, projects, hiring,

    goals, documents, learning, and webhooks. Generated best-effort from

    public docs at https://apidocs.hibob.com/.

    '
  version: 1.0.0
  contact:
    name: HiBob
    url: https://apidocs.hibob.com/
servers:
- url: https://api.hibob.com/v1
  description: Production
security:
- serviceUserAuth: []
tags:
- name: Learning
paths:
  /learning/lms-integrations:
    post:
      tags:
      - Learning
      summary: Create LMS integration
      responses:
        '201':
          description: Created
  /learning/lms-integrations/{provider-identifier}/training-content:
    post:
      tags:
      - Learning
      summary: Create training content
      parameters:
      - name: provider-identifier
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
components:
  securitySchemes:
    serviceUserAuth:
      type: http
      scheme: basic
      description: Service user credentials passed via HTTP Basic Authorization header
